version: '3.8'

services:
  secondself:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secondself_app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./data/raw:/app/raw
      - ./data/wiki:/app/wiki
      - ./data/db:/app/backend/db
    restart: unless-stopped
